name: 기상청 날씨 갱신

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (UTC 기준 = 한국시간 매시 17분)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 기상청 날씨 받아오기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: python3 scripts/fetch_weather.py

      - name: 변경되면 weather.json 저장
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "날씨 갱신"
            git push
          fi
