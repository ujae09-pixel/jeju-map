<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 여행 지도</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #map { position: absolute; inset: 0; }
  #filters {
    position: absolute; top: 44px; left: 10px; right: 10px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  #weather {
    position: absolute; top: 0; left: 0; right: 0; height: 36px; z-index: 12;
    background: rgba(255,255,255,.96); box-shadow: 0 1px 4px rgba(0,0,0,.25);
    display: flex; align-items: center; gap: 14px; padding: 0 10px; overflow-x: auto; white-space: nowrap;
    font-size: 13px; color: #333;
  }
  #weather .w { display: inline-flex; align-items: center; gap: 4px; }
  #weather .w b { font-weight: 600; }
  #weather button { border: 0; background: #e7f5ff; color: #1c4e9d; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; flex: none; }
  #weather .upd { color: #888; font-size: 11px; }
  #wcard {
    position: absolute; top: 40px; right: 10px; z-index: 26; display: none; max-width: calc(100% - 20px);
    background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.35);
    overflow-x: auto;
  }
  #wcard table { border-collapse: collapse; }
  #wcard th, #wcard td { padding: 5px 8px; text-align: center; border-bottom: 1px solid #eee; white-space: nowrap; }
  #wcard th:first-child, #wcard td:first-child { text-align: left; font-weight: 600; }
  #wcard small { display: block; color: #888; margin-top: 8px; line-height: 1.5; white-space: normal; max-width: 460px; }
  #list {
    position: absolute; z-index: 15; background: #fff; overflow-y: auto; transition: transform .25s ease;
    box-shadow: 0 0 12px rgba(0,0,0,.3);
  }
  #list .lh { position: sticky; top: 0; background: #fff; padding: 12px 14px 8px; font-weight: 600; border-bottom: 1px solid #eee; font-size: 14px; }
  #list .li { padding: 10px 14px; border-bottom: 1px solid #f1f1f1; cursor: pointer; }
  #list .li:hover { background: #f8f9fa; }
  #list .cat { display: inline-block; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; margin-right: 6px; }
  #list .nm { font-weight: 600; font-size: 14px; }
  #list .kd { float: right; font-size: 11px; color: #888; }
  #list .d { font-size: 12px; color: #555; margin-top: 4px; }
  #list .d2 { font-size: 12px; color: #888; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 720px) {
    #filters .frow { flex-wrap: nowrap; overflow-x: auto; pointer-events: auto; scrollbar-width: none; }
    #filters .frow::-webkit-scrollbar { display: none; }
    #filters .chip { flex: none; padding: 6px 11px; font-size: 12px; }
    #list { left: 0; right: 0; bottom: 0; max-height: 42%; border-radius: 16px 16px 0 0; transform: translateY(110%); }
    #list.open { transform: translateY(0); }
    #gpsbtn { bottom: 24px; }
    #gpsbtn.up { bottom: calc(42% + 12px); }
  }
  @media (min-width: 721px) {
    #list { top: 36px; right: 0; bottom: 0; width: 300px; transform: translateX(110%); }
    #list.open { transform: translateX(0); }
    body.withlist #filters { right: 310px; }
    body.withlist #gpsbtn, body.withlist #gpsoff { right: 312px; }
  }
  #gpsbtn, #gpsoff {
    position: absolute; right: 12px; z-index: 14; border: 0; cursor: pointer; background: #fff; color: #333;
    box-shadow: 0 1px 6px rgba(0,0,0,.4);
  }
  #gpsbtn { bottom: 28px; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; }
  #gpsbtn.on { background: #228be6; color: #fff; }
  #gpsoff { bottom: 84px; display: none; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  #toast {
    position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 40; display: none;
    background: rgba(30,30,30,.9); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 86%; text-align: center;
  }
  .frow { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    pointer-events: auto;
    border: 0; border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    background: #fff; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #tripcard {
    pointer-events: auto; display: none; align-self: flex-start; max-width: 340px;
    background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6;
    box-shadow: 0 1px 8px rgba(0,0,0,.3);
  }
  #tripcard b { display: block; margin-bottom: 4px; }
  #note { font-size: 11px; color: #888; margin-top: 8px; }
  .btns.two a { flex: 1 1 45%; }
  .btns a.navi { background: #3a7bff; color: #fff; }
  .plinks a.blog { background: #e6fcf5; color: #087f5b; }
  .plinks a.hot { background: #fff3bf; color: #6b5200; }
  #restroom { pointer-events: auto; display: none; align-self: flex-start; max-width: 360px; max-height: 40vh; overflow-y: auto;
    background: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: 0 1px 8px rgba(0,0,0,.3); }
  #restroom .item { padding: 6px 0; border-bottom: 1px solid #eee; cursor: pointer; }
  #restroom .item:last-child { border-bottom: 0; }
  #restroom small { color: #888; display: block; }
  .tagk { display: inline-block; margin-left: 6px; font-size: 12px; color: #666; }
  .kindbadge { margin-left: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid #bbb; color: #555; }
  .kindbadge.mine { background: #fff3bf; border-color: #f0c000; color: #6b5200; }
  .plinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .plinks a { text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 6px; background: #f1f3f5; color: #1c4e9d; }
  .chip.active { color: #fff; }
  #panel {
    position: absolute; z-index: 20; background: #fff; overflow-y: auto;
    box-shadow: 0 -2px 12px rgba(0,0,0,.3); padding: 18px 18px 24px;
    transition: transform .25s ease;
  }
  /* 모바일: 하단 시트 */
  @media (max-width: 720px) {
    #panel { left: 0; right: 0; bottom: 0; max-height: 55%; border-radius: 16px 16px 0 0; transform: translateY(110%); }
    #panel.open { transform: translateY(0); }
  }
  /* 데스크톱: 좌측 패널 */
  @media (min-width: 721px) {
    #panel { top: 36px; bottom: 0; left: 0; width: 340px; transform: translateX(-110%); box-shadow: 2px 0 12px rgba(0,0,0,.3); }
    #panel.open { transform: translateX(0); }
    #filters { left: 360px; }
  }
  #panel .badge { display: inline-block; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  #panel h2 { margin: 10px 0 6px; font-size: 22px; }
  #panel .row { margin: 10px 0; font-size: 14px; line-height: 1.5; color: #444; }
  #panel .label { display: block; font-size: 12px; color: #888; }
  #panel img { width: 100%; border-radius: 10px; margin-top: 6px; }
  #close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 26px; cursor: pointer; color: #666; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns a {
    flex: 1; text-align: center; text-decoration: none; padding: 10px 0; border-radius: 8px;
    font-size: 14px; background: #fee500; color: #222;
  }
  .btns a.sub { background: #eee; }
  #notice {
    position: absolute; inset: 0; z-index: 30; background: #fff; display: none;
    align-items: center; justify-content: center; text-align: center; padding: 24px; line-height: 1.7;
  }
  #notice code { background: #f1f1f1; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="weather">날씨 불러오는 중...</div>
<div id="wcard"></div>
<div id="filters"></div>
<div id="list"></div>
<button id="gpsoff">내 위치 끄기</button>
<button id="gpsbtn" aria-label="내 위치">📍</button>
<div id="toast"></div>
<div id="panel">
  <button id="close" aria-label="닫기">×</button>
  <div id="detail"></div>
</div>
<div id="notice"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=96ee784ddec0ba15bc488ce3700baaec&libraries=services&autoload=false"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.9/kakao.min.js"></script>
<script src="places.js"></script>
<script src="placemeta.js"></script>
<script src="app.js"></script>
</body>
</html>
